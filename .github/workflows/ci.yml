name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Audit dependencies (pip-audit)
        run: python -m pip_audit --progress=off

      - name: Tests (pytest)
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: ci-test-secret
        run: pytest -q

  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    needs: lint-test
    strategy:
      matrix:
        include:
          - image: api
            context: .
          - image: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.image }} image
        run: docker build -t scan-${{ matrix.image }}:latest ${{ matrix.context }}

      - name: Scan ${{ matrix.image }} image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-${{ matrix.image }}:latest
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  integration:
    name: Build + smoke compose (secrets)
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Générer .env depuis les GitHub Secrets
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          {
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_DB=$POSTGRES_DB"
            echo "SECRET_KEY=$SECRET_KEY"
            echo "PORT=8000"
          } > .env

      - name: Démarrer la stack (build inclus)
        run: docker compose up -d --build

      - name: Attendre que l'API réponde sur /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo " OK"; exit 0; fi
            sleep 3
          done
          echo "API jamais healthy — logs :"
          docker compose logs
          exit 1

      - name: Teardown
        if: always()
        run: docker compose down -v

  build-and-push:
    name: Build & push images (GHCR)
    runs-on: ubuntu-latest
    # Publication gatée sur lint+test ET le scan Trivy : on ne publie jamais
    # une image qui n'a pas passé le scan de sécurité.
    needs: [lint-test, security-scan]
    # On ne publie que sur push vers master (jamais depuis une PR).
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: .
          - image: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:latest
