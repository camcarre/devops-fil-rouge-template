services:
  db:
    image: postgres:16-alpine
    container_name: forum-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - forum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: forum-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      PORT: ${PORT:-8000}
      PYTHONPATH: /app
    ports:
      # Lié à 127.0.0.1 : accessible uniquement depuis la machine hôte,
      # jamais depuis le réseau (ex. wifi partagé).
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - forum-network
    command: >
      sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-8000}"

  frontend:
    build: ./frontend
    container_name: forum-frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    networks:
      - forum-network

volumes:
  postgres-data:

networks:
  forum-network:
    driver: bridge
