# GABARIT de Secret — versionné SANS valeurs réelles (règle : aucun secret dans Git).
#
# Pour déployer :
#   1. cp k8s/02-secret.example.yaml k8s/02-secret.yaml
#   2. remplir k8s/02-secret.yaml avec les vraies valeurs
#   3. kubectl apply -f k8s/02-secret.yaml
#
# k8s/02-secret.yaml est ignoré par Git (.gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: forum-secret
  namespace: forum
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<mot-de-passe-postgres>"
  SECRET_KEY: "<cle-secrete-jwt>"
